default:
  tags:
    - home

stages:
  - test
  - build
  - publish
  - update-chart

test:
  image: golang:1.26.10-alpine3.24
  stage: test
  services:
    - name: postgres:17-alpine
      alias: postgres
  variables:
    POSTGRES_DB: gitlab_docs_test
    POSTGRES_USER: gitlab_docs_test
    POSTGRES_PASSWORD: ci-test-password
    TEST_DATABASE_URL: "postgres://gitlab_docs_test:ci-test-password@postgres:5432/gitlab_docs_test?sslmode=disable"
  before_script:
    - apk add --no-cache bash git tar
  script:
    - go test ./...

chart_test:
  image: golang:1.26.10-alpine3.24
  stage: test
  variables:
    GOBIN: "$CI_PROJECT_DIR/.tools"
  script:
    - go install helm.sh/helm/v3/cmd/helm@v3.17.3
    - .tools/helm lint deploy/helm/gitlab-doc-platform
    - go test ./internal/chart -count=1

vulnerability_check:
  image: golang:1.26.10-alpine3.24
  stage: test
  script:
    - go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...

build:
  image: golang:1.26.10-alpine3.24
  stage: build
  script:
    - go build ./cmd/api ./cmd/worker ./cmd/mcp

docker_build_and_push:
  image: docker:27.4.1-cli
  stage: publish
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      when: never
    - if: '$CI_COMMIT_TAG'
    - if: '$CI_COMMIT_BRANCH'
  before_script:
    - docker info
    - echo "$CI_REGISTRY_PASSWORD" | docker login "$CI_REGISTRY" --username "$CI_REGISTRY_USER" --password-stdin
  script:
    - docker build --pull --tag "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHA" .
    - docker push "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHA"
    - |
      if [ -n "$CI_COMMIT_TAG" ]; then
        docker tag "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHA" "$CI_REGISTRY_IMAGE:git-$CI_COMMIT_REF_SLUG"
        docker push "$CI_REGISTRY_IMAGE:git-$CI_COMMIT_REF_SLUG"
      fi
  after_script:
    - docker logout "$CI_REGISTRY"

update_helm_image_tag:
  image: golang:1.26.10-alpine3.24
  stage: update-chart
  needs:
    - job: docker_build_and_push
      artifacts: false
  resource_group: helm-image-tag
  variables:
    GIT_DEPTH: "0"
    GIT_TERMINAL_PROMPT: "0"
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_PIPELINE_SOURCE != "merge_request_event"'
  before_script:
    - apk add --no-cache git
    - git config user.name "GitLab CI"
    - git config user.email "gitlab-ci@${CI_SERVER_HOST}"
  script:
    - |
      values_file=deploy/helm/gitlab-doc-platform/values.yaml
      git fetch --no-tags origin "$CI_DEFAULT_BRANCH"
      if ! git diff --quiet "$CI_COMMIT_SHA" FETCH_HEAD -- . ":(exclude)$values_file"; then
        echo "Default-branch source changed; skipping this older image."
        exit 0
      fi
      git checkout -B "$CI_DEFAULT_BRANCH" FETCH_HEAD
      go run ./cmd/set-image-tag --values "$values_file" --tag "$CI_COMMIT_SHA"
      if git diff --quiet -- "$values_file"; then
        echo "Helm image tag is already current."
        exit 0
      fi
      git add -- "$values_file"
      git commit -m "ci: update Helm image to $CI_COMMIT_SHA [skip ci]"
      git -c credential.helper= \
        -c 'credential.helper=!f() { if [ "$1" = get ]; then printf "%s\n" "username=gitlab-ci-token" "password=$CI_JOB_TOKEN"; fi; }; f' \
        push "$CI_SERVER_URL/$CI_PROJECT_PATH.git" "HEAD:$CI_DEFAULT_BRANCH"
