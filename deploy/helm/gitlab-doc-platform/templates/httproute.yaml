{{- if .Values.gateway.enabled }}
{{- range $component := list "api" "mcp" }}
{{- if or (eq $component "api") $.Values.mcp.enabled }}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "gitlab-doc-platform.name" $ }}-{{ $component }}
spec:
  parentRefs:
    - name: {{ $.Values.gateway.name | quote }}
      {{- with $.Values.gateway.namespace }}
      namespace: {{ . | quote }}
      {{- end }}
      {{- with $.Values.gateway.sectionName }}
      sectionName: {{ . | quote }}
      {{- end }}
  hostnames:
    - {{ required (printf "gateway.%sHostname is required" $component) (index $.Values.gateway (printf "%sHostname" $component)) | quote }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: {{ if eq $component "api" }}/api/v1{{ else }}/mcp{{ end }}
      backendRefs:
        - name: {{ include "gitlab-doc-platform.name" $ }}-{{ $component }}
          port: 80
{{- end }}
{{- end }}
{{- end }}
