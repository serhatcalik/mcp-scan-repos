apiVersion: v1
kind: Service
metadata:
  name: {{ include "gitlab-doc-platform.name" . }}-api
  labels:
    {{- include "gitlab-doc-platform.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
    monitoring.gitlab-doc-platform/enabled: "true"
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/component: api
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "gitlab-doc-platform.name" . }}-worker
  labels:
    {{- include "gitlab-doc-platform.labels" . | nindent 4 }}
    app.kubernetes.io/component: worker
    monitoring.gitlab-doc-platform/enabled: "true"
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/component: worker
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - name: http
      port: {{ .Values.worker.metricsPort }}
      targetPort: metrics
{{- if .Values.mcp.enabled }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "gitlab-doc-platform.name" . }}-mcp
  labels:
    {{- include "gitlab-doc-platform.labels" . | nindent 4 }}
    app.kubernetes.io/component: mcp
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/component: mcp
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - name: http
      port: 80
      targetPort: http
{{- end }}
{{- if .Values.mcp.enabled }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "gitlab-doc-platform.name" . }}-mcp-metrics
  labels:
    {{- include "gitlab-doc-platform.labels" . | nindent 4 }}
    app.kubernetes.io/component: mcp
    monitoring.gitlab-doc-platform/enabled: "true"
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/component: mcp
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - name: http
      port: {{ .Values.mcp.metricsPort }}
      targetPort: metrics
{{- end }}
