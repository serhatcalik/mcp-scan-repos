stages:
  - documentation

variables:
  DOCUMENTATION_API_URL: ""
  DOCUMENTATION_AUDIENCE: "gitlab-doc-platform"
  DOCUMENTATION_POLL_SECONDS: "10"
  DOCUMENTATION_TIMEOUT_SECONDS: "5400"
  DOCUMENTATION_ARCHIVE: "source-for-documentation.tar.gz"
  DOCUMENTATION_HTTP_RETRIES: "3"
  DOCUMENTATION_GIT_TAGS_ENABLED: "true"

generate_documentation:
  stage: documentation
  timeout: 100m
  image: alpine:3.22
  cache: []
  dependencies: []
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
  id_tokens:
    GITLAB_DOCS_ID_TOKEN:
      aud: $DOCUMENTATION_AUDIENCE
  before_script:
    - apk add --no-cache curl tar jq git
  script:
    - test -n "$DOCUMENTATION_API_URL" || { echo "DOCUMENTATION_API_URL is required"; exit 2; }
    - mkdir -p generated-docs
    - |
      archive_dir=$(mktemp -d /tmp/gitlab-docs.XXXXXX)
      archive_path="$archive_dir/$(basename "$DOCUMENTATION_ARCHIVE")"
      trap 'rm -f "$archive_path" "$archive_dir/source.tar" "$archive_dir/git-tags" "$archive_dir/git-tags-error" "$archive_dir/.gitlab-docs-release.json"; rmdir "$archive_dir"' EXIT
      case "$DOCUMENTATION_GIT_TAGS_ENABLED" in
        true|false) ;;
        *) echo "DOCUMENTATION_GIT_TAGS_ENABLED must be true or false"; exit 2 ;;
      esac
      if [ "$DOCUMENTATION_GIT_TAGS_ENABLED" = true ] && [ -f "$CI_PROJECT_DIR/go.mod" ]; then
        if timeout 30s git -C "$CI_PROJECT_DIR" ls-remote --tags origin > "$archive_dir/git-tags" 2> "$archive_dir/git-tags-error"; then
          git_tags_json=$(awk -v commit="$CI_COMMIT_SHA" '
            $1 == commit && $2 ~ /^refs\/tags\// {
              tag = $2
              sub(/^refs\/tags\//, "", tag)
              sub(/\^\{\}$/, "", tag)
              print tag
            }
          ' "$archive_dir/git-tags" | sort -u | jq -R -s 'split("\n") | map(select(length > 0))')
          jq -n --arg project "$CI_PROJECT_ID" --arg commit "$CI_COMMIT_SHA" --argjson tags "$git_tags_json" \
            '{schema_version: 1, project_id: $project, commit_sha: $commit, git_tags: $tags}' \
            > "$archive_dir/.gitlab-docs-release.json"
        else
          echo "Git tag lookup unavailable; documentation will use source version declarations or date."
        fi
      fi
      tar --exclude=.git --exclude=node_modules --exclude=dist --exclude=build \
        --exclude=target --exclude=vendor --exclude=generated-docs \
        --exclude=.gitlab-docs-release.json \
        --exclude="$DOCUMENTATION_ARCHIVE" --exclude='*.exe' \
        --exclude='*.dll' --exclude='*.so' \
        -cf "$archive_dir/source.tar" -C "$CI_PROJECT_DIR" .
      if [ -f "$archive_dir/.gitlab-docs-release.json" ]; then
        tar -rf "$archive_dir/source.tar" -C "$archive_dir" .gitlab-docs-release.json
      fi
      gzip -c "$archive_dir/source.tar" > "$archive_path"
    - |
      if curl --silent --show-error --fail-with-body \
        --retry "$DOCUMENTATION_HTTP_RETRIES" --retry-delay 2 --connect-timeout 15 --max-time 300 \
        --request POST "$DOCUMENTATION_API_URL/api/v1/jobs" \
        --header "Authorization: Bearer $GITLAB_DOCS_ID_TOKEN" \
        --form "project_id=$CI_PROJECT_ID" \
        --form "commit_sha=$CI_COMMIT_SHA" \
        --form "branch=$CI_COMMIT_BRANCH" \
        --form "archive=@$archive_path" \
        --output generated-docs/upload-response.json; then
        response=$(cat generated-docs/upload-response.json)
      else
        curl_exit=$?
        echo "Documentation upload failed; API response:"
        cat generated-docs/upload-response.json 2>/dev/null || true
        exit "$curl_exit"
      fi
    - job_id=$(echo "$response" | jq -r '.job_id')
    - test -n "$job_id" && test "$job_id" != "null" || { echo "API did not return a job_id"; echo "$response"; exit 3; }
    - deadline=$(( $(date +%s) + DOCUMENTATION_TIMEOUT_SECONDS ))
    - |
      while true; do
        status_json=$(curl --silent --show-error --fail \
          --retry "$DOCUMENTATION_HTTP_RETRIES" --retry-delay 2 --connect-timeout 15 --max-time 60 \
          --header "Authorization: Bearer $GITLAB_DOCS_ID_TOKEN" \
          "$DOCUMENTATION_API_URL/api/v1/jobs/$job_id");
        status=$(echo "$status_json" | jq -r '.status');
        echo "documentation job $job_id status: $status";
        case "$status" in
          completed) break ;;
          failed|cancelled) echo "$status_json"; exit 4 ;;
        esac;
        test "$(date +%s)" -lt "$deadline" || { echo "Timed out waiting for documentation job"; exit 5; };
        sleep "$DOCUMENTATION_POLL_SECONDS";
      done
    - >
      curl --silent --show-error --fail
      --retry "$DOCUMENTATION_HTTP_RETRIES" --retry-delay 2 --connect-timeout 15 --max-time 300
      --header "Authorization: Bearer $GITLAB_DOCS_ID_TOKEN"
      "$DOCUMENTATION_API_URL/api/v1/jobs/$job_id/artifacts" --output generated-docs/artifacts.tar.gz
  artifacts:
    when: always
    expire_in: 14 days
    paths:
      - generated-docs/
